          Storage.data.soundEnabled = !Storage.data.soundEnabled;
          soundBtn.innerText = Storage.data.soundEnabled ? '🔊' : '🔇';
          Storage.save();
        });
        soundBtn.innerText = Storage.data.soundEnabled ? '🔊' : '🔇';
      },

      transitionTo(newState) {
        this.state = newState;
        const modalLayer = document.getElementById('modal-layer');
        const modalContent = document.getElementById('modal-content');
        const curCar = Storage.getSelectedCar();

        switch (newState) {
          case STATES.MENU:
            modalLayer.classList.remove('hidden');
            modalContent.innerHTML = `
              <h1 class="modal-title">SPEED RACER</h1>
              <p class="modal-subtitle">Хардкорная гонка по шоссе: плотный трафик, препятствия и система классов машин.</p>
              
              <div style="margin-bottom:16px; background:rgba(15,23,42,0.6); padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;">
                <div style="text-align:left;">
                  <div style="font-size:10px; color:#94a3b8; text-transform:uppercase;">Выбранный автомобиль</div>
                  <div style="font-size:15px; font-weight:800; color:#38bdf8;">${curCar.name} <span style="font-size:10px; color:${curCar.tagColor};">(${curCar.tag})</span></div>
                </div>
                <button class="primary-btn" id="open-garage-btn" style="width:auto; padding:8px 14px; font-size:12px; background:linear-gradient(135deg, #d97706, #f59e0b);">🚗 ГАРАЖ</button>
              </div>

              <div class="modal-stats" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-box">
                  <div class="lbl">Рекорд очков</div>
                  <div class="val">${Storage.data.highScore}</div>
                </div>
                <div class="stat-box">
                  <div class="lbl">Лучшая дист.</div>
                  <div class="val" style="color:#38bdf8;">${Storage.data.bestDistance || 0} м</div>
                </div>
                <div class="stat-box">
                  <div class="lbl">Монеты</div>
                  <div class="val" style="color:#fbbf24;">🪙 ${Storage.data.totalCoins}</div>
                </div>
              </div>

              <button class="primary-btn" id="start-btn">ПОЕХАЛИ !</button>
              <button class="secondary-btn" id="open-leaderboard-btn" style="margin-top:8px;">🏆 ТАБЛИЦА ЛИДЕРОВ</button>
              <div class="controls-hint">
                Управление: <b>A/D</b> или <b>Стрелки</b> (руль), <b>W</b> (газ), <b>S</b> (тормоз)<br>
                На смартфонах: экранные кнопки или тапы по сторонам экрана
              </div>
            `;
            document.getElementById('start-btn').addEventListener('click', () => {
              SoundEngine.resume();
              this.startNewGame();
            });
            document.getElementById('open-garage-btn').addEventListener('click', () => {
              this.transitionTo(STATES.GARAGE);
            });
            document.getElementById('open-leaderboard-btn').addEventListener('click', () => {
              this.transitionTo(STATES.LEADERBOARD);
            });
            break;

          case STATES.GARAGE:
            modalLayer.classList.remove('hidden');
            this.renderGarageModal(modalContent);
            break;

          case STATES.LEADERBOARD:
            modalLayer.classList.remove('hidden');
            this.renderLeaderboardModal(modalContent);
            break;

          case STATES.PLAYING:
            modalLayer.classList.add('hidden');
            break;

          case STATES.PAUSED:
            modalLayer.classList.remove('hidden');
            modalContent.innerHTML = `
              <h2 class="modal-title">ПАУЗА</h2>
              <p class="modal-subtitle">Гонка приостановлена</p>
              <div class="modal-stats">
                <div class="stat-box">
                  <div class="lbl">Текущий счет</div>
                  <div class="val">${Math.floor(this.score)}</div>
                </div>
                <div class="stat-box">
                  <div class="lbl">Дистанция</div>
                  <div class="val">${Math.floor(this.distance)} м</div>
                </div>
              </div>
              <button class="primary-btn" id="resume-btn">ПРОДОЛЖИТЬ</button>
              <button class="secondary-btn" id="restart-from-pause">В ГЛАВНОЕ МЕНЮ</button>
            `;
            document.getElementById('resume-btn').addEventListener('click', () => this.transitionTo(STATES.PLAYING));
            document.getElementById('restart-from-pause').addEventListener('click', () => this.transitionTo(STATES.MENU));
            break;

          case STATES.CRASH_FX:
            this.crashTimer = 1.0;
            SoundEngine.playCrash();
            break;

          case STATES.GAME_OVER:
            if (this.score > Storage.data.highScore) {
              Storage.data.highScore = Math.floor(this.score);
            }
            Storage.data.totalCoins += this.coinsSession;
            Storage.recordDistance(this.distance);

            modalLayer.classList.remove('hidden');
            modalContent.innerHTML = `
              <h2 class="modal-title" style="color:#ef4444;">АВАРИЯ!</h2>
              <p class="modal-subtitle">Автомобиль уничтожен на шоссе</p>
              <div class="modal-stats">
                <div class="stat-box">
                  <div class="lbl">Ваш счет</div>
                  <div class="val">${Math.floor(this.score)}</div>
                </div>
                <div class="stat-box">
                  <div class="lbl">Рекорд очков</div>
                  <div class="val">${Storage.data.highScore}</div>
                </div>
                <div class="stat-box">
                  <div class="lbl">Дистанция</div>
                  <div class="val">${Math.floor(this.distance)} м</div>
                </div>
                <div class="stat-box">
                  <div class="lbl">Лучшая дист.</div>
                  <div class="val" style="color:#38bdf8;">${Storage.data.bestDistance} м</div>
                </div>
              </div>
              <button class="primary-btn" id="retry-btn">ИГРАТЬ СНОВА</button>
              <button class="secondary-btn" id="leaderboard-from-gameover" style="margin-top:8px;">🏆 ТАБЛИЦА ЛИДЕРОВ</button>
              <button class="primary-btn gold-btn" id="garage-from-gameover" style="margin-top:8px;">🚗 ГАРАЖ / МАГАЗИН</button>
              <button class="secondary-btn" id="menu-btn">ГЛАВНОЕ МЕНЮ</button>
            `;
            document.getElementById('retry-btn').addEventListener('click', () => this.startNewGame());
            document.getElementById('leaderboard-from-gameover').addEventListener('click', () => this.transitionTo(STATES.LEADERBOARD));
            document.getElementById('garage-from-gameover').addEventListener('click', () => this.transitionTo(STATES.GARAGE));
            document.getElementById('menu-btn').addEventListener('click', () => this.transitionTo(STATES.MENU));
            break;
        }
      },

      renderGarageModal(container) {
        const owned = Storage.data.ownedCars || ['starter'];
        const selected = Storage.data.selectedCar || 'starter';

        let carsHtml = CARS.map(car => {
          const isOwned = owned.includes(car.id);
          const isSelected = selected === car.id;
          
          // Проценты для шкал (нормализация характеристик)
          const spdPct = Math.min(100, Math.round((car.maxSpeed / 680) * 100));
          const accPct = Math.min(100, Math.round((car.acceleration / 300) * 100));
          const hndPct = Math.min(100, Math.round((car.handling / 400) * 100));
          // Защита: чем меньше множитель armor, тем выше шкала защиты
          const armPct = Math.min(100, Math.round((1.7 - car.armor) / 1.4 * 100));

          let actionBtn = '';
          if (isSelected) {
            actionBtn = `<button class="car-btn car-btn-active">ВЫБРАНА</button>`;
          } else if (isOwned) {
            actionBtn = `<button class="car-btn car-btn-select" onclick="GameFSM.selectCar('${car.id}')">ВЫБРАТЬ</button>`;
          } else {
            const canAfford = Storage.data.totalCoins >= car.price;
            actionBtn = `<button class="car-btn car-btn-buy" ${canAfford ? '' : 'style="opacity:0.5; cursor:not-allowed;"'} onclick="GameFSM.buyCar('${car.id}')">КУПИТЬ (${car.price} 🪙)</button>`;
          }

          return `
            <div class="car-card ${isSelected ? 'selected' : ''}">
              <div class="car-card-header">
                <div class="car-card-title">
                  <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${car.bodyColor}; border:1px solid #fff;"></span>
                  ${car.name}
                </div>
                <span class="car-tag" style="background:${car.tagBg}; color:${car.tagColor};">${car.tag}</span>
              </div>
              <div class="car-desc">${car.desc}</div>
              <div class="car-stats-list">
                <div class="stat-row">
                  <div class="stat-row-label"><span>Скорость</span> <span>${Math.round(car.maxSpeed * 0.45)} км/ч</span></div>
                  <div class="stat-meter"><div class="stat-meter-fill meter-speed" style="width:${spdPct}%;"></div></div>
                </div>
                <div class="stat-row">
                  <div class="stat-row-label"><span>Разгон</span> <span>${car.acceleration}</span></div>
                  <div class="stat-meter"><div class="stat-meter-fill meter-accel" style="width:${accPct}%;"></div></div>
                </div>
                <div class="stat-row">
                  <div class="stat-row-label"><span>Прочность / Броня</span> <span>${car.maxHealth} HP</span></div>
                  <div class="stat-meter"><div class="stat-meter-fill meter-armor" style="width:${armPct}%;"></div></div>
                </div>
                <div class="stat-row">
                  <div class="stat-row-label"><span>Маневр</span> <span>${car.handling}</span></div>
                  <div class="stat-meter"><div class="stat-meter-fill meter-handling" style="width:${hndPct}%;"></div></div>
                </div>
              </div>
              <div class="car-action-bar">
                <div class="car-price">${car.price === 0 ? 'БЕСПЛАТНО' : `${car.price} 🪙`}</div>
                ${actionBtn}
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="garage-header">
            <h2 class="modal-title" style="margin:0; font-size:20px;">ГАРАЖ & МАГАЗИН</h2>
            <div class="garage-coins">🪙 <span id="garage-coins-val">${Storage.data.totalCoins}</span></div>
          </div>
          <div class="cars-grid">
            ${carsHtml}
          </div>
          <button class="primary-btn" id="garage-back-btn">НАЗАД В МЕНЮ</button>
        `;

        document.getElementById('garage-back-btn').addEventListener('click', () => {
          this.transitionTo(STATES.MENU);
        });
      },

      renderLeaderboardModal(container) {
        const board = Storage.data.leaderboard || [];
        const currentPlayer = Storage.data.playerName || 'Игрок';

        const rowsHtml = board.map((entry, idx) => {
          const rank = idx + 1;
          const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
          const medal = rank === 1 ? '🥇 ' : (rank === 2 ? '🥈 ' : (rank === 3 ? '🥉 ' : ''));
          const isCurrent = entry.name === currentPlayer;
          return `
            <tr class="${isCurrent ? 'highlight-player' : ''}">
              <td class="leaderboard-rank ${rankClass}">${medal}${rank}</td>
              <td style="color:${isCurrent ? '#38bdf8' : '#f8fafc'};">${entry.name}${isCurrent ? ' (Вы)' : ''}</td>
              <td style="text-align:right; font-weight:800; color:#fbbf24;">${entry.distance} м</td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <h2 class="modal-title" style="margin-bottom:4px;">ТАБЛИЦА ЛИДЕРОВ</h2>
          <p class="modal-subtitle">Топ пилотов по пройденной дистанции за один заезд</p>
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th style="width:40px; text-align:center;">Место</th>
                <th>Имя игрока</th>
                <th style="text-align:right;">Дистанция</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
          <button class="primary-btn" id="leaderboard-back-btn">НАЗАД В МЕНЮ</button>
        `;

        document.getElementById('leaderboard-back-btn').addEventListener('click', () => {
          this.transitionTo(STATES.MENU);
        });
      },

      buyCar(carId) {
        const car = CARS.find(c => c.id === carId);
        if (!car) return;
        if (Storage.data.totalCoins >= car.price) {
          Storage.data.totalCoins -= car.price;
          if (!Storage.data.ownedCars.includes(carId)) {
            Storage.data.ownedCars.push(carId);
          }
          Storage.data.selectedCar = carId;
          Storage.save();
          SoundEngine.playPickup();
          this.renderGarageModal(document.getElementById('modal-content'));
        }
      },

      selectCar(carId) {
        if (Storage.data.ownedCars.includes(carId)) {
          Storage.data.selectedCar = carId;
          Storage.save();
          SoundEngine.playPickup();
          this.renderGarageModal(document.getElementById('modal-content'));
        }
      },

      startNewGame() {
        this.score = 0;
        this.distance = 0;
        this.coinsSession = 0;
        Player.reset();
        TrafficManager.reset();
        PickupsManager.reset();
        ParticlePool.clear();
        InputManager.reset();
        this.transitionTo(STATES.PLAYING);
      },

      togglePause() {
        if (this.state === STATES.PLAYING) {
          this.transitionTo(STATES.PAUSED);
        } else if (this.state === STATES.PAUSED) {
          this.transitionTo(STATES.PLAYING);
        }
      },

      onCrash() {
        ParticlePool.spawnExplosion(Player.x + Player.width / 2, Player.y + Player.height / 2, 40);
        this.transitionTo(STATES.CRASH_FX);
      }
    };

    /* ==========================================================================
       МОДУЛЬ 8: GAME LOOP (requestAnimationFrame с фиксированным dt)
       ========================================================================== */
    let lastTime = performance.now();

    // Cached HUD DOM references for zero allocations
    const hudScore = document.getElementById('hud-score');
    const hudCoins = document.getElementById('hud-coins');
    const hudSpeed = document.getElementById('hud-speed');
    const hudDist = document.getElementById('hud-distance');
    const hudHealth = document.getElementById('hud-health');
    const hudHealthTxt = document.getElementById('hud-health-txt');
    const hudNitro = document.getElementById('hud-nitro');

    function update(dt) {
      if (GameFSM.state === STATES.PLAYING) {
        Player.update(dt);
        Road.update(dt, Player.speed);
        TrafficManager.update(dt, Player.speed);
        PickupsManager.update(dt, Player.speed);
        ParticlePool.update(dt);

        // Score & Distance progression
        const speedKmH = Math.round(Player.speed * 0.45);
        GameFSM.distance += (Player.speed * dt) * 0.1;
        GameFSM.score += (Player.speed * dt * 0.05);

        // Check Pickups Collision
        for (let i = PickupsManager.items.length - 1; i >= 0; i--) {
          const item = PickupsManager.items[i];
          if (checkCollision(Player, item)) {
            if (item.type === 'coin') {
              GameFSM.score += CONFIG.PICKUPS.COIN_SCORE;
              GameFSM.coinsSession += 1;
              SoundEngine.playPickup();
              ParticlePool.spawnExplosion(item.x + item.width / 2, item.y + item.height / 2, 8);
            } else if (item.type === 'fuel') {
              Player.health = Math.min(Player.maxHealth, Player.health + 35);
              SoundEngine.playPickup();
              ParticlePool.spawnExplosion(item.x + item.width / 2, item.y + item.height / 2, 10);
            } else if (item.type === 'nitro') {
              Player.nitroTimer = CONFIG.PICKUPS.NITRO_DURATION;
              SoundEngine.playNitro();
              ParticlePool.spawnExplosion(item.x + item.width / 2, item.y + item.height / 2, 20);
            }
            PickupsManager.items.splice(i, 1);
          }
        }

        // Check Traffic & Obstacles Collisions
        for (let i = TrafficManager.items.length - 1; i >= 0; i--) {
          const target = TrafficManager.items[i];
          if (checkCollision(Player, target)) {
            if (Player.nitroTimer > 0) {
              // В режиме Nitro машина разбивает любые препятствия без получения урона
              ParticlePool.spawnExplosion(target.x + target.width / 2, target.y + target.height / 2, 25);
              SoundEngine.playCrash();
              TrafficManager.items.splice(i, 1);
              GameFSM.score += 250;
            } else {
              // Расчет урона в зависимости от типа препятствия
              let baseDamage = 35;
              if (target.category === 'obstacle') {
                if (target.type === 'cone') {
                  baseDamage = 6;
                  Player.speed = Math.max(CONFIG.PLAYER.BASE_SPEED * 0.7, Player.speed - 80);
                } else if (target.type === 'pothole') {
                  baseDamage = 10;
                  Player.spinTimer = 0.5; // потеря сцепления
                } else if (target.type === 'barrier') {
                  baseDamage = 45;
                }
              } else if (target.category === 'car') {
                if (target.type === 'truck') {
                  baseDamage = 85;
                } else if (target.type === 'sport') {
                  baseDamage = 28;
                } else {
                  baseDamage = 35;
                }
              }

              // Применяем урон с учетом брони
              Player.takeDamage(baseDamage);
              ParticlePool.spawnExplosion(target.x + target.width / 2, target.y + target.height / 2, 18);
              SoundEngine.playCrash();

              // Удаляем разрушенный объект (кроме ямы)
              if (target.type !== 'pothole') {
                TrafficManager.items.splice(i, 1);
              }

              if (Player.health <= 0) {
                Player.health = 0;
                GameFSM.onCrash();
                break;
              }
            }
          }
        }

        // Update Sound & HUD
        const speedRatio = (Player.speed - CONFIG.PLAYER.BASE_SPEED) / (Player.maxSpeed - CONFIG.PLAYER.BASE_SPEED);
        SoundEngine.updateEnginePitch(Math.max(0, speedRatio), true);

        hudScore.innerText = Math.floor(GameFSM.score);
        if (hudCoins) hudCoins.innerText = Storage.data.totalCoins + GameFSM.coinsSession;
        hudSpeed.innerText = speedKmH;
        hudDist.innerText = Math.floor(GameFSM.distance);
        
        const healthPct = Math.max(0, Math.min(100, Math.round((Player.health / Player.maxHealth) * 100)));
        hudHealth.style.width = healthPct + '%';
        if (hudHealthTxt) hudHealthTxt.innerText = `${Math.round(Player.health)}/${Player.maxHealth}`;

        if (healthPct < 30) hudHealth.style.background = '#ef4444';
        else if (healthPct < 60) hudHealth.style.background = '#f59e0b';
        else hudHealth.style.background = 'linear-gradient(90deg, #22c55e, #10b981)';

        if (Player.nitroTimer > 0) {
          hudNitro.classList.add('nitro-active');
        } else {
          hudNitro.classList.remove('nitro-active');
        }

      } else if (GameFSM.state === STATES.CRASH_FX) {
        ParticlePool.update(dt);
        GameFSM.crashTimer -= dt;
        SoundEngine.updateEnginePitch(0, false);
        if (GameFSM.crashTimer <= 0) {
          GameFSM.transitionTo(STATES.GAME_OVER);
        }
      } else {
        SoundEngine.updateEnginePitch(0, false);
      }
    }

    function render() {
      CanvasScaler.applyTransform();
      const ctx = CanvasScaler.ctx;

      // Draw World
      Road.draw(ctx);
      PickupsManager.draw(ctx);
      TrafficManager.draw(ctx);

      if (GameFSM.state !== STATES.GAME_OVER) {
        Player.draw(ctx);
      }

      ParticlePool.draw(ctx);
    }

    function gameLoop(currentTime) {
      // Delta timing with clamping (Math.min(dt, 0.1)) to avoid jumps when tab is inactive
      let dt = (currentTime - lastTime) / 1000;
      dt = Math.min(dt, 0.1);
      lastTime = currentTime;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    // BOOTSTRAP
    window.addEventListener('DOMContentLoaded', () => {
      CanvasScaler.init();
      InputManager.init();
      GameFSM.init();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
